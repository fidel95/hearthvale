<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hearthvale: a cottage with a lit window on a green hill. Drawn inside the
       middle 80% so it survives being cropped to a circle (maskable icons). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4ec"/>
      <stop offset="1" stop-color="#c9ecff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="380" cy="150" r="42" fill="#ffe08a"/>
  <path d="M0 360 Q128 300 256 330 T512 320 V512 H0 Z" fill="#7fc36a"/>
  <path d="M0 400 Q160 350 300 385 T512 370 V512 H0 Z" fill="#5fae55"/>
  <!-- chimney and smoke -->
  <rect x="300" y="168" width="34" height="62" fill="#9a4a3a"/>
  <circle cx="322" cy="146" r="14" fill="#ffffff" opacity="0.85"/>
  <circle cx="340" cy="120" r="18" fill="#ffffff" opacity="0.7"/>
  <!-- house -->
  <rect x="160" y="250" width="192" height="130" rx="6" fill="#f4e3c3"/>
  <path d="M140 262 L256 168 L372 262 Z" fill="#c4553f"/>
  <rect x="236" y="306" width="40" height="74" rx="4" fill="#7a4a2f"/>
  <rect x="184" y="282" width="38" height="34" rx="4" fill="#ffc94d"/>
  <rect x="290" y="282" width="38" height="34" rx="4" fill="#ffc94d"/>
  <path d="M203 282 V316 M184 299 H222 M309 282 V316 M290 299 H328" stroke="#c98a2a" stroke-width="4"/>
</svg>
